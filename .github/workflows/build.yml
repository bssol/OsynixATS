name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Osynix.Ats.slnx
      - run: dotnet build Osynix.Ats.slnx --no-restore --configuration Release
      - run: dotnet test Osynix.Ats.slnx --no-build --configuration Release
